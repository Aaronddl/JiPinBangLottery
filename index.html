<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>极品帮抽卡</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#070403;color:#efe4da;overflow:hidden;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  user-select:none;-webkit-user-select:none;
}
#app{
  --pool-accent:#ff7a1a;
  --pool-glow:rgba(255,110,26,.16);
  --pool-bg:rgba(29,14,5,1);
  position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;
  background:
    radial-gradient(120% 55% at 50% -5%, var(--pool-bg) 0%, #070403 62%),
    radial-gradient(85% 45% at 50% 112%, var(--pool-glow), transparent 72%);
}
#app::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
  opacity:.55;
}

/* ============ PC 宽屏适配 ============ */
@media (min-width: 640px){
  body{
    background:
      radial-gradient(72% 62% at 50% 0%, #180b04 0%, #070403 58%, #040201 100%);
  }
  #app{
    border-left:1px solid rgba(255,122,26,.14);
    border-right:1px solid rgba(255,122,26,.14);
    box-shadow:
      0 0 110px -26px rgba(255,110,26,.4),
      inset 0 0 100px rgba(0,0,0,.55);
  }
}

/* ============ 顶部操作区 ============ */
.top-actions{
  position:absolute;z-index:90;
  top:calc(14px + env(safe-area-inset-top,0px));
  right:14px;
  display:flex;gap:8px;align-items:center;
}
.top-nav{
  position:absolute;z-index:80;top:calc(8px + env(safe-area-inset-top,0px));
  left:12px;right:108px;display:flex;align-items:center;gap:10px;
  min-height:42px;pointer-events:none;
}
.brand{min-width:0;display:flex;flex-direction:column;gap:2px}
.brand-title{
  color:#fff1e5;font-size:15px;font-weight:900;letter-spacing:.04em;
  white-space:nowrap;text-shadow:0 0 15px var(--pool-accent);
}
.brand-sub{
  color:var(--pool-accent);font-size:8px;letter-spacing:.2em;white-space:nowrap;
}
.top-rates{
  min-width:0;display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;
  margin-left:auto;
}
.top-rates .pool-chip{font-size:9px;padding:4px 7px;letter-spacing:0;white-space:nowrap}
.skip-btn{
  padding:9px 15px;border-radius:999px;
  font-family:inherit;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-indent:.14em;
  color:#ffc089;cursor:pointer;
  border:1px solid rgba(255,122,26,.42);
  background:linear-gradient(180deg, rgba(255,122,26,.2), rgba(255,122,26,.05));
  box-shadow:0 0 22px -8px rgba(255,122,26,.7);
  transition:transform .16s, opacity .3s, color .2s, border-color .2s, box-shadow .2s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.skip-btn:active{transform:scale(.94)}
.skip-btn.hidden{opacity:0;pointer-events:none;display:none}
.mute-btn{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;padding:0;
  cursor:pointer;color:#ffc089;
  border:1px solid rgba(255,122,26,.42);
  background:linear-gradient(180deg, rgba(255,122,26,.2), rgba(255,122,26,.05));
  box-shadow:0 0 22px -8px rgba(255,122,26,.7);
  transition:transform .16s, color .2s, opacity .3s, border-color .2s, box-shadow .2s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.mute-btn:active{transform:scale(.92)}
.mute-btn.muted{color:rgba(255,192,137,.42)}
.mute-btn .ic-off{display:none}
.mute-btn.muted .ic-on{display:none}
.mute-btn.muted .ic-off{display:block}

/* ============ 全屏特效层 ============ */
#fxLayer{
  position:absolute;inset:0;z-index:85;pointer-events:none;overflow:hidden;
}
.fx-flash{
  position:absolute;inset:0;
  animation:fxFlash .85s ease-out forwards;
}
@keyframes fxFlash{
  0%{opacity:0}
  16%{opacity:1}
  100%{opacity:0}
}
.fx-wave{
  position:absolute;left:50%;top:86%;width:44px;height:44px;
  margin:-22px 0 0 -22px;border-radius:50%;
  border:2px solid #fff;opacity:0;
  animation:fxWave 1.15s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes fxWave{
  0%{transform:scale(.2);opacity:1}
  70%{opacity:.6}
  100%{transform:scale(26);opacity:0}
}
.fx-legend-pulse{
  position:absolute;inset:0;
  animation:legendPulse 1.2s ease-out forwards;
}
@keyframes legendPulse{
  0%{opacity:0;transform:scale(.6)}
  22%{opacity:1}
  100%{opacity:0;transform:scale(1.15)}
}
.fx-spark{
  position:absolute;width:5px;height:5px;border-radius:50%;
  animation:fxSparkFly ease-out forwards;
}
@keyframes fxSparkFly{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}
}

/* 屏幕抖动 */
@keyframes shakeSoft{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-4px,2px)}
  40%{transform:translate(3px,-3px)}
  60%{transform:translate(-3px,-1px)}
  80%{transform:translate(2px,2px)}
}
@keyframes shakeHard{
  0%,100%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(-8px,4px) rotate(-.4deg)}
  25%{transform:translate(7px,-6px) rotate(.4deg)}
  38%{transform:translate(-6px,-3px) rotate(-.3deg)}
  52%{transform:translate(6px,5px) rotate(.3deg)}
  68%{transform:translate(-4px,3px) rotate(-.2deg)}
  84%{transform:translate(3px,-2px) rotate(.15deg)}
}
#app.shake{animation:shakeSoft .45s ease}
#app.shake-hard{animation:shakeHard .72s ease}

/* ============ 屏幕 ============ */
.screen{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;
  padding:22px 20px 150px;
  opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .4s ease, transform .4s ease;
}
.screen.active{opacity:1;pointer-events:auto;transform:none}
#screenIdle{padding:72px 18px 184px}

/* ============ 待机 ============ */
.title-block{text-align:center;margin:auto 0;position:relative;z-index:3}
.roster-wrap{
  width:100%;max-width:420px;margin:auto 0;position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.roster-title{
  font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.62);
  text-shadow:0 0 14px var(--pool-accent);
}
.featured-roster{
  width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;
}
.featured-card{
  min-width:0;min-height:90px;padding:10px 5px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  border:1px solid color-mix(in srgb,var(--pool-accent) 48%,transparent);
  background:linear-gradient(150deg,rgba(255,255,255,.055),rgba(0,0,0,.4));
  box-shadow:0 0 20px -10px var(--pool-accent),inset 0 0 18px -12px var(--pool-accent);
}
.featured-sigil{font-size:28px;line-height:1;text-shadow:0 0 16px var(--pool-accent)}
.featured-name{
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#f5ece4;font-size:11px;font-weight:700;
}
.pool-nav{
  position:absolute;z-index:40;left:10px;right:10px;bottom:calc(7px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;gap:8px;padding:7px;
  border:1px solid color-mix(in srgb,var(--pool-accent) 34%,transparent);
  border-radius:16px;background:rgba(8,5,4,.86);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:opacity .25s,transform .25s;
}
.pool-nav.hidden{opacity:0;pointer-events:none;transform:translateY(12px)}
.pool-nav-btn{
  flex:1;max-width:190px;padding:9px 10px;border-radius:10px;
  color:rgba(255,232,215,.68);font-family:inherit;font-size:12px;font-weight:700;
  line-height:1.2;letter-spacing:.1em;
  border:1px solid transparent;background:transparent;cursor:pointer;
}
.pool-nav-btn.active{
  color:#fff5ec;border-color:var(--pool-accent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--pool-accent) 32%,transparent),rgba(0,0,0,.2));
  box-shadow:0 0 20px -8px var(--pool-accent);
}
.pool-nav-btn:active{transform:scale(.97)}
.title-sub{
  font-size:11px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(255,150,80,.65);margin-bottom:16px;
}
.title{
  margin:0;font-size:46px;font-weight:900;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff6ee 0%,#ffb066 52%,#ff5f0a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,110,26,.5));
}
.title-line{
  width:130px;height:1px;margin:24px auto;
  background:linear-gradient(90deg,transparent,rgba(255,122,26,.85),transparent);
}
.pool-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pool-chip{
  font-size:11px;padding:5px 13px;border-radius:999px;letter-spacing:.06em;
}
.pool-chip.r4{color:#a855f7;border:1px solid rgba(168,85,247,.45);background:rgba(168,85,247,.10)}
.pool-chip.r5{color:#f0b429;border:1px solid rgba(240,180,41,.45);background:rgba(240,180,41,.10)}
.pool-chip.r6{color:#ff4a1c;border:1px solid rgba(255,74,28,.5);background:rgba(255,74,28,.10)}

/* 待机火星粒子 */
.idle-particles{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.ember{
  position:absolute;bottom:-14px;border-radius:50%;
  background:radial-gradient(circle,#fff,var(--pool-accent) 60%,transparent);
  box-shadow:0 0 9px var(--pool-accent);
  animation:emberRise linear infinite;opacity:0;
}
@keyframes emberRise{
  0%{transform:translateY(0) scale(.6);opacity:0}
  12%{opacity:.85}
  78%{opacity:.6}
  100%{transform:translateY(-108vh) scale(1.05);opacity:0}
}

/* ============ 展示页 ============ */
#screenReveal{padding:64px 20px 34px;justify-content:flex-start}
.reveal-top{display:flex;flex-direction:column;align-items:center;gap:11px;padding-top:6px}
.reveal-counter{font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.45)}
.reveal-counter b{
  font-size:22px;font-weight:800;color:#ffb066;margin-right:5px;
  text-shadow:0 0 18px rgba(255,122,26,.65);
}
.reveal-dots{display:flex;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14);transition:all .3s}
.dot.current{background:#fff;box-shadow:0 0 10px #fff;transform:scale(1.35)}
.stage{flex:1;width:100%;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}

.tap-hint{
  font-size:12px;letter-spacing:.35em;text-indent:.35em;
  color:rgba(255,255,255,.5);opacity:0;margin-top:4px;
}
.tap-hint.show{animation:hintPulse 2.2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.3}50%{opacity:1}}

/* ============ 稀有度闪光（阶段一） ============ */
.flash-card{
  grid-area:1/1;
  width:min(74vw,288px);aspect-ratio:3/4;
  border-radius:18px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:
    radial-gradient(circle at 50% 46%, var(--c-soft) 0%, rgba(10,5,3,.92) 70%),
    linear-gradient(165deg,#1c110a,#0b0604);
  border:1px solid var(--c-border);
  box-shadow:0 0 70px -8px var(--c-glow), inset 0 0 60px -14px var(--c-glow);
  animation:flashIn .38s cubic-bezier(.2,.9,.3,1.3) both;
}
@keyframes flashIn{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:scale(1)}}
.flash-card.out{animation:flashOut .42s ease forwards}
@keyframes flashOut{to{opacity:0;transform:scale(1.16);filter:blur(10px)}}
.flash-card.flash-strong{
  border-color:var(--c);
  box-shadow:0 0 100px -6px var(--c), 0 0 150px -24px var(--c-glow), inset 0 0 74px -12px var(--c-glow);
}
.flash-rays-wrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.flash-rays{
  width:260%;aspect-ratio:1;opacity:.55;
  background:repeating-conic-gradient(from 0deg, var(--c-glow) 0deg 2deg, transparent 2deg 14deg);
  -webkit-mask:radial-gradient(circle,#000 4%,transparent 56%);
  mask:radial-gradient(circle,#000 4%,transparent 56%);
  animation:spin 12s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.flash-ring{
  position:absolute;left:50%;top:50%;width:64px;height:64px;
  margin:-32px 0 0 -32px;border-radius:50%;
  border:2px solid var(--c);box-shadow:0 0 34px var(--c);
  animation:ringExpand .95s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes ringExpand{
  0%{transform:scale(.25);opacity:1}
  100%{transform:scale(6.5);opacity:0}
}
.flash-stars{
  position:relative;font-size:27px;letter-spacing:6px;color:var(--c);
  text-shadow:0 0 20px var(--c),0 0 55px var(--c-glow);
  animation:starPop .55s cubic-bezier(.2,.9,.3,1.4) both;
}
@keyframes starPop{
  from{opacity:0;transform:scale(.4);letter-spacing:22px}
  to{opacity:1;transform:scale(1);letter-spacing:6px}
}
.flash-label{
  position:relative;font-size:12px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(255,255,255,.82);text-shadow:0 0 16px var(--c);
}

/* ============ 完整卡牌（阶段二） ============ */
.gcard{
  grid-area:1/1;
  width:min(74vw,288px);aspect-ratio:3/4;
  border-radius:18px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  background:linear-gradient(165deg,#1c110a 0%,#0b0604 58%,#130b06 100%);
  border:1px solid var(--c-border);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.85),
    0 0 38px -6px var(--c-glow),
    0 24px 52px -20px #000,
    inset 0 0 46px rgba(0,0,0,.72);
  animation:cardIn .52s cubic-bezier(.2,.9,.3,1.25) both;
}
@keyframes cardIn{
  from{opacity:0;transform:scale(.82) translateY(16px);filter:blur(8px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
.gcard.leaving{animation:cardLeave .24s ease forwards}
@keyframes cardLeave{
  to{opacity:0;transform:scale(1.09) translateY(-16px);filter:blur(7px)}
}
.gcard-art{
  position:relative;flex:1;overflow:hidden;display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 42%, var(--c-soft) 0%, transparent 64%),
    linear-gradient(180deg, rgba(255,255,255,.035), transparent 42%);
}
.gcard-art::after{
  content:'';position:absolute;top:-60%;left:-90%;width:52%;height:220%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
  transform:rotate(22deg);z-index:1;pointer-events:none;
  animation:shineSweep 2.9s ease-in-out .5s infinite;
}
@keyframes shineSweep{
  0%{left:-90%;opacity:0}
  14%{opacity:1}
  46%{left:118%;opacity:0}
  100%{left:118%;opacity:0}
}
.rays-wrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.rays{
  width:195%;aspect-ratio:1;opacity:.8;
  background:repeating-conic-gradient(from 0deg, var(--c-soft) 0deg 3deg, transparent 3deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 30%,transparent 62%);
  mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 30%,transparent 62%);
  animation:spin 30s linear infinite;
}
.gcard-sigil{
  position:relative;z-index:2;font-size:clamp(58px,17vw,84px);line-height:1;color:#fff;
  text-shadow:0 0 14px var(--c),0 0 46px var(--c-glow),0 0 90px var(--c-glow);
  animation:bob 4.5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(-4px) scale(1)}50%{transform:translateY(4px) scale(1.05)}}
.card-spark{
  position:absolute;z-index:3;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff,var(--c) 62%,transparent);
  box-shadow:0 0 10px var(--c);
  opacity:0;animation:sparkFloat ease-in-out infinite;
}
@keyframes sparkFloat{
  0%{transform:translateY(26px) scale(.35);opacity:0}
  22%{opacity:.95}
  100%{transform:translateY(-74px) scale(1);opacity:0}
}
.gcard-info{
  position:relative;z-index:2;padding:12px 16px 16px;
  background:linear-gradient(180deg, rgba(8,4,2,.15), rgba(8,4,2,.96) 42%);
  border-top:1px solid var(--c-border);
}
.gcard-name{
  font-size:19px;font-weight:800;letter-spacing:.04em;color:#fff;
  text-shadow:0 0 16px var(--c-glow);
}
.gcard-meta{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.gcard-tag{
  font-size:11px;letter-spacing:.12em;padding:3px 9px;border-radius:5px;
  color:var(--c);background:var(--c-soft);border:1px solid var(--c-border);
}
.gcard-stars{font-size:13px;letter-spacing:3px;color:var(--c);text-shadow:0 0 12px var(--c-glow)}

/* ============================================================
   六星入场动画 —— 三段分镜
   ============================================================ */
.legend-intro{
  position:absolute;inset:0;z-index:80;overflow:hidden;background:#000;
}
.legend-intro.hidden{display:none}
.legend-intro.fade-out{opacity:0;transition:opacity .55s ease}

.li-shot{
  position:absolute;inset:0;overflow:hidden;
  display:none;
}
.li-shot.active{display:block}

.li-cut-flash{
  position:absolute;inset:0;background:#fff;opacity:0;
  pointer-events:none;z-index:30;
}
.li-cut-flash.flash{animation:cutFlash .18s ease-out forwards}
@keyframes cutFlash{
  0%{opacity:.55}
  100%{opacity:0}
}

.li-caption{
  position:absolute;left:0;right:0;bottom:9%;
  text-align:center;z-index:20;pointer-events:none;
  font-size:13px;font-weight:700;
  letter-spacing:.5em;text-indent:.5em;
  color:#ffb066;text-shadow:0 0 16px #ff5f0a;
  opacity:0;animation:liCaption 10s ease-in-out forwards;
}
@keyframes liCaption{
  0%,86%{opacity:0;letter-spacing:.5em}
  93%{opacity:1;letter-spacing:.32em}
  100%{opacity:.9;letter-spacing:.32em}
}

/* ---------- 镜头1：太空远景 ---------- */
.s1-cam{
  position:absolute;inset:0;
  animation:s1Cam 2.8s ease-out forwards;
}
@keyframes s1Cam{
  0%{transform:scale(1)}
  100%{transform:scale(1.16)}
}

.s1-space{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 115%,
    #0a2444 0%, #061626 32%, #030a14 62%, #000 100%);
}
.s1-stars{
  position:absolute;inset:-10%;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 28% 9%, #cfe6ff, transparent),
    radial-gradient(2px 2px at 44% 26%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 61% 13%, #cfe6ff, transparent),
    radial-gradient(1.6px 1.6px at 76% 31%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 89% 8%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 20% 44%, #9fc6ff, transparent),
    radial-gradient(1.8px 1.8px at 55% 49%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 71% 58%, #cfe6ff, transparent),
    radial-gradient(1.6px 1.6px at 37% 66%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 83% 47%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 6% 72%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 94% 64%, #cfe6ff, transparent);
  background-repeat:no-repeat;
  animation:s1Stars 2.8s ease-out forwards;
}
@keyframes s1Stars{
  0%{transform:scale(1) rotate(0);opacity:.9}
  100%{transform:scale(1.5) rotate(6deg);opacity:.6}
}

.s1-earth{
  position:absolute;left:50%;bottom:-150vw;
  width:210vw;height:210vw;border-radius:50%;
  background:
    radial-gradient(circle at 50% 5%,
      #6fc0ff 0%, #2f74c8 22%, #14407a 48%, #071c38 72%, #030a14 100%);
  box-shadow:
    0 0 160px 54px rgba(70,150,255,.38),
    inset 0 0 180px rgba(150,220,255,.22);
  transform:translateX(-50%);
  animation:s1Earth 2.8s cubic-bezier(.4,0,.55,1) forwards;
}
@keyframes s1Earth{
  0%{transform:translate(-50%, 0) scale(.92);filter:brightness(.6)}
  100%{transform:translate(-50%, -10vh) scale(1.18);filter:brightness(1.1)}
}
.s1-earth::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse at 50% 3%,
    rgba(255,255,255,.16) 0%, transparent 32%);
}

.s1-meteor{
  position:absolute;top:9%;left:14%;
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%, #ffd9a8 22%, #ff7a1a 62%, transparent 100%);
  box-shadow:0 0 22px #ff9a4a, 0 0 48px #ff5f0a;
  animation:s1Meteor 2.8s cubic-bezier(.4,0,.65,1) forwards;
}
@keyframes s1Meteor{
  0%{transform:translate(0,0) scale(.35);opacity:0}
  18%{opacity:1}
  100%{transform:translate(36vw, 46vh) scale(1.35);opacity:1}
}
.s1-meteor::after{
  content:'';position:absolute;right:100%;top:50%;
  width:130px;height:3px;transform:translateY(-50%);
  background:linear-gradient(90deg, transparent, #ffb066 55%, #fff 100%);
  border-radius:2px;filter:blur(1px);
}

/* ---------- 镜头2：大气层高速跟随 ---------- */
.s2-sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    #061424 0%, #0c2a44 18%, #3a2210 48%, #7a3010 74%, #401100 100%);
  animation:s2Sky 3.4s ease-in forwards;
}
@keyframes s2Sky{
  0%{transform:scale(1);filter:brightness(.7)}
  100%{transform:scale(1.12);filter:brightness(1.15)}
}
.s2-clouds{
  position:absolute;left:-20%;right:-20%;top:-40%;bottom:-40%;
  background:repeating-linear-gradient(178deg,
    transparent 0 34px,
    rgba(255,200,150,.14) 34px 60px,
    transparent 60px 120px);
  filter:blur(16px);opacity:.85;
  animation:s2Clouds 3.4s linear forwards;
}
@keyframes s2Clouds{
  0%{transform:translateY(-46%)}
  100%{transform:translateY(52%)}
}
.s2-ground-blur{
  position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(to top, rgba(120,40,10,.85), transparent);
  filter:blur(14px);
  animation:s2GroundBlur 3.4s ease-in forwards;
}
@keyframes s2GroundBlur{
  0%{opacity:.2}
  100%{opacity:1}
}
.s2-speed{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(92deg,
    transparent 0 26px,
    rgba(255,220,180,.22) 26px 28px,
    transparent 28px 52px);
  -webkit-mask:radial-gradient(ellipse at 50% 46%, transparent 12%, #000 72%);
  mask:radial-gradient(ellipse at 50% 46%, transparent 12%, #000 72%);
  animation:s2Speed 3.4s linear forwards;
}
@keyframes s2Speed{
  0%{opacity:0;background-position:0 0}
  30%{opacity:.7}
  100%{opacity:1;background-position:160px 0}
}
.s2-shake{
  position:absolute;inset:0;
  animation:s2Shake .14s ease-in-out infinite;
}
@keyframes s2Shake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-1.5px,1px)}
  50%{transform:translate(1px,-1.5px)}
  75%{transform:translate(-1px,-1px)}
}

.s2-flyer{
  position:absolute;left:50%;top:44%;
  width:96px;height:96px;margin:-48px 0 0 -48px;
  border-radius:50%;display:grid;place-items:center;
  font-size:52px;font-weight:900;color:#fff;line-height:1;
  background:radial-gradient(circle at 40% 32%,
    #ffd6a3 0%, #ff5f0a 46%, #8a1d00 78%, #2a0800 100%);
  box-shadow:
    0 0 44px #ff5f0a,
    0 0 100px rgba(255,74,28,.7),
    inset 0 0 26px rgba(255,220,170,.75);
  text-shadow:0 0 18px #fff, 0 0 46px #ff5f0a;
  animation:s2Flyer 3.4s cubic-bezier(.4,0,.6,1) forwards;
  will-change:transform;
}
@keyframes s2Flyer{
  0%{transform:scale(.42) translateY(-6vh)}
  30%{transform:scale(.7) translateY(-2vh)}
  70%{transform:scale(1) translateY(0)}
  100%{transform:scale(1.18) translateY(2vh)}
}
.s2-flyer::before{
  content:'';position:absolute;left:50%;bottom:100%;
  width:52px;height:210px;transform:translateX(-50%);
  background:linear-gradient(to top,
    rgba(255,205,130,.95) 0%,
    rgba(255,120,30,.78) 32%,
    rgba(255,50,0,.3) 66%, transparent 100%);
  border-radius:50% 50% 42% 42%;
  filter:blur(7px);
  animation:s2Flame .12s ease-in-out infinite alternate;
}
@keyframes s2Flame{
  0%{transform:translateX(-50%) scaleY(1) scaleX(1)}
  100%{transform:translateX(-50%) scaleY(1.1) scaleX(.94)}
}

/* ---------- 镜头3：地面仰视降落 ---------- */
.s3-sky{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 12%, rgba(255,150,60,.4) 0%, transparent 46%),
    linear-gradient(180deg, #200a02 0%, #100502 55%, #050201 100%);
}
.s3-ground{
  position:absolute;left:-20%;right:-20%;bottom:-8%;height:46%;
  background:
    radial-gradient(ellipse at 50% 0%, #3a1608 0%, #1c0a03 46%, #080201 100%);
  border-top-left-radius:50% 18%;
  border-top-right-radius:50% 18%;
}
.s3-horizon{
  position:absolute;left:0;right:0;top:56%;height:2px;
  background:linear-gradient(90deg, transparent, rgba(255,122,26,.5), transparent);
  filter:blur(1px);
}
.s3-platform{
  position:absolute;left:50%;top:62%;
  width:180px;height:180px;margin:-90px 0 0 -90px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,120,40,.4) 0%, rgba(255,74,28,.12) 52%, transparent 72%);
  border:2px solid rgba(255,120,60,.55);
  box-shadow:
    0 0 54px rgba(255,74,28,.55),
    inset 0 0 44px rgba(255,120,60,.32);
  transform:scaleY(.3);
  animation:s3Platform 3.1s ease-out forwards;
}
@keyframes s3Platform{
  0%{opacity:0;transform:scaleY(.3) scale(.42)}
  22%{opacity:.65;transform:scaleY(.3) scale(.66)}
  76%{opacity:1;transform:scaleY(.3) scale(1.06)}
  100%{opacity:1;transform:scaleY(.3) scale(1)}
}
.s3-platform::before{
  content:'';position:absolute;left:50%;top:50%;
  width:64%;height:64%;margin:-32% 0 0 -32%;
  border-radius:50%;
  border:1px solid rgba(255,180,120,.4);
  box-shadow:0 0 26px rgba(255,120,60,.4);
}

.s3-flyer{
  position:absolute;left:50%;top:62%;
  width:72px;height:72px;margin:-36px 0 0 -36px;
  border-radius:50%;display:grid;place-items:center;
  font-size:38px;font-weight:900;color:#fff;line-height:1;
  background:radial-gradient(circle at 40% 32%,
    #ffd6a3 0%, #ff5f0a 46%, #8a1d00 78%, #2a0800 100%);
  box-shadow:
    0 0 40px #ff5f0a,
    0 0 90px rgba(255,74,28,.7),
    inset 0 0 26px rgba(255,220,170,.75);
  text-shadow:0 0 18px #fff, 0 0 46px #ff5f0a;
  animation:s3Flyer 3.1s cubic-bezier(.5,0,.9,.55) forwards;
  will-change:transform;
}
@keyframes s3Flyer{
  0%{opacity:0;transform:translateY(-96vh) scale(.08)}
  12%{opacity:1}
  62%{transform:translateY(-22vh) scale(.55)}
  80%{transform:translateY(-4vh) scale(.94)}
  88%{transform:translateY(0) scale(1.08)}
  94%{transform:translateY(-1.4vh) scale(.97)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.s3-flyer::before{
  content:'';position:absolute;left:50%;bottom:100%;
  width:44px;height:190px;transform:translateX(-50%);
  background:linear-gradient(to top,
    rgba(255,205,130,.95) 0%,
    rgba(255,120,30,.75) 32%,
    rgba(255,50,0,.28) 66%, transparent 100%);
  border-radius:50% 50% 42% 42%;
  filter:blur(6px);
  animation:s3Flame .13s ease-in-out infinite alternate;
}
@keyframes s3Flame{
  0%{transform:translateX(-50%) scaleY(1)}
  100%{transform:translateX(-50%) scaleY(1.12)}
}

.s3-shock{
  position:absolute;left:50%;top:62%;
  width:140px;height:140px;margin:-70px 0 0 -70px;
  border-radius:50%;border:2px solid #ffb066;
  box-shadow:0 0 44px #ff5f0a, inset 0 0 34px rgba(255,140,40,.6);
  opacity:0;transform:scale(.2);
  animation:s3Shock 1s ease-out 2.72s forwards;
}
.s3-shock2{animation-delay:2.86s;border-color:#ff7a1a}
@keyframes s3Shock{
  0%{opacity:0;transform:scale(.2)}
  18%{opacity:1;transform:scale(.6)}
  100%{opacity:0;transform:scale(11)}
}

.s3-dust{
  position:absolute;left:50%;top:62%;
  width:260px;height:60px;margin:-30px 0 0 -130px;
  border-radius:50%;
  background:radial-gradient(ellipse,
    rgba(255,150,70,.5) 0%, rgba(255,90,20,.18) 46%, transparent 72%);
  filter:blur(12px);opacity:0;
  animation:s3Dust 1.1s ease-out 2.72s forwards;
}
@keyframes s3Dust{
  0%{opacity:0;transform:scale(.4)}
  22%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.9)}
}

/* ============ 总览页 ============ */
#screenSummary{padding:68px 20px 34px;justify-content:flex-start}
.sum-head{
  font-size:12px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(255,150,80,.8);margin-bottom:18px;flex:0 0 auto;
}
.sum-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;
  max-height:64vh;overflow-y:auto;padding:2px 2px 6px;
  -webkit-overflow-scrolling:touch;
}
.sum-card{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;
  background:linear-gradient(150deg, rgba(255,255,255,.045), rgba(0,0,0,.4));
  border:1px solid var(--c-border);
  box-shadow:0 0 18px -7px var(--c-glow), inset 0 0 16px -10px var(--c-glow);
  animation:sumIn .42s cubic-bezier(.2,.9,.3,1.2) both, sumGlow 3.4s ease-in-out infinite;
}
@keyframes sumIn{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
@keyframes sumGlow{
  0%,100%{box-shadow:0 0 18px -7px var(--c-glow), inset 0 0 16px -10px var(--c-glow)}
  50%{box-shadow:0 0 26px -4px var(--c-glow), inset 0 0 20px -6px var(--c-glow)}
}
.sum-sigil{
  width:31px;height:31px;flex:0 0 31px;display:grid;place-items:center;
  font-size:17px;color:#fff;border-radius:9px;
  background:var(--c-soft);border:1px solid var(--c-border);
  text-shadow:0 0 10px var(--c);
}
.sum-body{min-width:0;flex:1}
.sum-name{
  font-size:12.5px;font-weight:700;color:#f5ece4;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sum-meta{display:flex;align-items:center;gap:6px;margin-top:4px}
.sum-tag{font-size:9.5px;color:var(--c);border:1px solid var(--c-border);border-radius:4px;padding:1px 4px}
.sum-stars{font-size:9.5px;color:var(--c);letter-spacing:1px}
.again-btn{
  margin-top:20px;flex:0 0 auto;
  padding:13px 44px;border-radius:999px;cursor:pointer;font-family:inherit;
  border:1px solid rgba(255,122,26,.5);
  background:linear-gradient(180deg, rgba(255,122,26,.24), rgba(255,122,26,.06));
  color:#ffb066;font-size:14px;font-weight:700;letter-spacing:.22em;text-indent:.22em;
  box-shadow:0 0 30px -8px rgba(255,122,26,.75), inset 0 0 20px -10px rgba(255,122,26,.7);
  transition:transform .18s, box-shadow .18s;
}
.again-btn:active{transform:scale(.955);box-shadow:0 0 18px -10px rgba(255,122,26,.9)}

/* ============ 拉杆 ============ */
#leverBar{
  position:absolute;left:0;right:0;bottom:60px;z-index:30;
  padding:0 22px calc(28px + env(safe-area-inset-bottom,0px));
  transition:opacity .35s ease, transform .35s ease;
}
#leverBar.hidden{opacity:0;transform:translateY(26px);pointer-events:none}
.lever-hint{
  text-align:center;font-size:11px;letter-spacing:.32em;text-indent:.32em;
  color:rgba(255,150,80,.55);margin-bottom:14px;transition:color .3s;
}

/* 抽数选择 */
.pull-mode-row{
  display:flex;gap:8px;justify-content:center;
  margin-bottom:12px;
}
.mode-btn{
  padding:7px 22px;border-radius:999px;
  font-family:inherit;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-indent:.14em;
  color:rgba(255,180,120,.72);
  border:1px solid rgba(255,122,26,.3);
  background:rgba(255,122,26,.05);
  cursor:pointer;
  transition:all .2s ease;
}
.mode-btn.active{
  color:#1a0a02;
  background:linear-gradient(180deg,#ffb066,#ff7a1a);
  border-color:#ff7a1a;
  box-shadow:0 0 24px -6px rgba(255,122,26,.9);
}
.mode-btn:active{transform:scale(.95)}
.pull-mode-row.disabled .mode-btn{
  opacity:.5;pointer-events:none;
}

.track{
  position:relative;height:64px;border-radius:32px;overflow:hidden;
  background:linear-gradient(180deg,#160c07,#0a0503);
  border:1px solid rgba(255,122,26,.22);
  box-shadow:inset 0 2px 16px rgba(0,0,0,.92), 0 12px 34px -14px #000;
  touch-action:none;
  cursor:pointer;
  transition:border-color .25s, box-shadow .35s;
}
.track-ambient{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 36px -4px #ff7a1a;
  animation:breath 3.2s ease-in-out infinite;
}
@keyframes breath{
  0%,100%{filter:brightness(.55)}
  50%{filter:brightness(1.45)}
}
.track-fill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg, rgba(255,122,26,.06), #ff7a1a);
  opacity:.22;
  transition:width .32s cubic-bezier(.2,.9,.3,1.2), opacity .25s, background .3s;
}
.track-glow{
  position:absolute;left:0;top:0;bottom:0;width:0;opacity:0;
  background:linear-gradient(90deg, transparent, #ff7a1a);
  filter:blur(14px);
  transition:width .32s cubic-bezier(.2,.9,.3,1.2), opacity .25s, background .3s;
}
.track.dragging .track-fill,
.track.dragging .track-glow{transition:none}
.track-flow{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  background:repeating-linear-gradient(100deg,
    transparent 0 14px, rgba(255,255,255,.4) 14px 18px, transparent 18px 34px);
  mix-blend-mode:overlay;transition:opacity .3s;
}
.track.charged .track-flow{opacity:.7;animation:flowMove 1.1s linear infinite}
@keyframes flowMove{
  from{background-position:0 0}
  to{background-position:68px 0}
}
.track-lines{
  position:absolute;inset:0;pointer-events:none;opacity:.45;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 14px);
  -webkit-mask:linear-gradient(90deg, transparent, #000);
  mask:linear-gradient(90deg, transparent, #000);
}
.track.charged{
  border-color:var(--gc,#ff7a1a);
  box-shadow:
    inset 0 2px 16px rgba(0,0,0,.92),
    0 0 50px -4px var(--gc,#ff7a1a),
    0 0 100px -12px var(--gc,#ff7a1a);
}
.track.charged .track-glow{animation:glowPulse .95s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.65}50%{opacity:1}}
.track.charged .knob{animation:knobPulse .95s ease-in-out infinite}
@keyframes knobPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6)}}
.knob{
  position:absolute;top:50%;left:0;z-index:2;
  width:58px;height:58px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#ffc089;
  background:radial-gradient(circle at 34% 28%, #5c3217, #1a0d06 68%);
  border:1px solid rgba(255,140,60,.55);
  box-shadow:0 0 20px rgba(255,122,26,.38), inset 0 0 14px rgba(255,140,60,.25);
  transform:translate(3px,-50%);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.2), box-shadow .25s, color .25s;
  touch-action:none;cursor:grab;
}
.knob.dragging{transition:none;cursor:grabbing}

/* ============ PC 悬停反馈 ============ */
@media (hover:hover) and (pointer:fine){
  .skip-btn:hover{
    color:#ffd9b0;
    border-color:rgba(255,150,70,.75);
    box-shadow:0 0 32px -6px rgba(255,122,26,.95);
  }
  .mute-btn:hover{
    color:#ffd9b0;
    border-color:rgba(255,150,70,.75);
    box-shadow:0 0 32px -6px rgba(255,122,26,.95);
  }
  .mute-btn.muted:hover{ color:rgba(255,200,150,.7); }
  .mode-btn:hover{
    color:#ffd9b0;
    border-color:rgba(255,150,70,.65);
    background:rgba(255,122,26,.12);
  }
  .mode-btn.active:hover{
    color:#1a0a02;
    background:linear-gradient(180deg,#ffc48a,#ff8a2e);
  }
  .again-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 0 42px -6px rgba(255,122,26,.95), inset 0 0 22px -8px rgba(255,122,26,.85);
  }
  .track:hover{ border-color:rgba(255,122,26,.42); }
  .knob:hover{
    color:#ffe0c0;
    box-shadow:0 0 32px rgba(255,122,26,.7), inset 0 0 18px rgba(255,140,60,.42);
  }
  .gcard:hover{
    box-shadow:
      0 0 0 1px rgba(0,0,0,.85),
      0 0 52px -4px var(--c-glow),
      0 24px 52px -20px #000,
      inset 0 0 46px rgba(0,0,0,.72);
  }
  .sum-card:hover{ border-color:var(--c); }
}

/* ============================================================
   横屏适配：拉杆在左，竖向；内容区在右
   ============================================================ */
@media (orientation: landscape) and (max-height: 560px){
  body{ overflow:hidden; }

  #app{
    max-width:none;
    border-left:none;
    border-right:none;
    box-shadow:none;
  }

  /* 所有内容区让出左侧拉杆宽度 */
  .screen{
    left:96px;
    right:78px;
    padding:10px 16px 12px;
  }

  /* ---- 待机 ---- */
  #screenIdle{padding:58px 12px 12px}
  .top-nav{top:calc(5px + env(safe-area-inset-top,0px));left:108px;right:160px;min-height:38px}
  .brand-title{font-size:13px}
  .brand-sub{font-size:7px}
  .top-rates .pool-chip{font-size:8px;padding:3px 5px}
  .roster-wrap{max-width:100%;gap:8px}
  .featured-roster{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .featured-card{min-height:68px;padding:6px 4px;gap:4px}
  .featured-sigil{font-size:22px}
  .featured-name{font-size:9px}
  #leverBar{z-index:30}
  .title-sub{
    font-size:9px;letter-spacing:.35em;text-indent:.35em;margin-bottom:8px;
  }
  .title{ font-size:clamp(26px,7vh,40px); }
  .title-line{ width:90px;margin:12px auto; }
  .pool-row{ gap:6px; }
  .pool-chip{ font-size:9.5px;padding:4px 10px;letter-spacing:.04em; }

  /* ---- 逐张展示 ---- */
  #screenReveal{ padding:48px 16px 12px; }
  .reveal-top{ gap:6px;padding-top:2px; }
  .reveal-counter{ font-size:10px; }
  .reveal-counter b{ font-size:17px; }
  .dot{ width:5px;height:5px; }
  .tap-hint{ font-size:10px;letter-spacing:.25em;text-indent:.25em;margin-top:0; }

  /* 卡牌按屏幕高度约束，保证完整显示 */
  .gcard,
  .flash-card{
    width:auto;
    height:min(64vh,300px);
    max-height:100%;
    aspect-ratio:3/4;
  }
  .gcard-sigil{ font-size:clamp(38px,12vh,62px); }
  .gcard-info{ padding:8px 12px 12px; }
  .gcard-name{ font-size:15px; }
  .gcard-meta{ margin-top:6px; }
  .gcard-tag{ font-size:10px;padding:2px 7px; }
  .gcard-stars{ font-size:11px;letter-spacing:2px; }
  .flash-stars{ font-size:21px;letter-spacing:4px; }
  .flash-label{ font-size:10px;letter-spacing:.3em;text-indent:.3em; }
  .flash-card{ gap:10px; }

  /* ---- 总览 ---- */
  #screenSummary{ padding:48px 16px 12px; justify-content:center; }
  .sum-head{
    font-size:10px;letter-spacing:.3em;text-indent:.3em;margin-bottom:10px;
  }
  .sum-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    max-height:none;
    overflow:visible;
    padding:0;
  }
  .sum-card{
    flex:0 0 118px;
    padding:5px 6px;
    gap:5px;
    border-radius:8px;
  }
  .sum-sigil{
    width:24px;height:24px;flex:0 0 24px;font-size:13px;border-radius:6px;
  }
  .sum-name{ font-size:10.5px; }
  .sum-meta{ gap:4px;margin-top:2px; }
  .sum-tag{ font-size:8px;padding:0 3px; }
  .sum-stars{ font-size:8px;letter-spacing:0; }
  .again-btn{
    margin-top:12px;padding:9px 32px;font-size:12px;
    letter-spacing:.18em;text-indent:.18em;
  }

  /* ---- 拉杆区：左侧竖向 ---- */
  #leverBar{
    left:0;right:auto;top:0;bottom:0;
    width:96px;
    padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    transform:none;
  }
  #leverBar.hidden{
    transform:translateX(-30px);
    opacity:0;
  }

  .pull-mode-row{
    order:0;
    flex-direction:column;
    gap:6px;
    margin:0;
    flex:0 0 auto;
  }
  .mode-btn{
    width:64px;
    padding:6px 0;
    font-size:10.5px;
    letter-spacing:.1em;
    text-indent:.1em;
  }

  .track{
    order:1;
    width:56px;
    height:auto;
    flex:1 1 auto;
    min-height:0;
    max-height:none;
    border-radius:28px;
  }

  .lever-hint{
    order:2;
    flex:0 0 auto;
    font-size:9px;
    letter-spacing:.1em;
    text-indent:.1em;
    margin:0;
    white-space:nowrap;
  }

  /* 竖向填充：从顶部往下增长 */
  .track-fill{
    left:0;right:0;top:0;bottom:auto;
    width:100% !important;
    height:0;
    background:linear-gradient(180deg, rgba(255,122,26,.06), #ff7a1a);
    transition:height .32s cubic-bezier(.2,.9,.3,1.2), opacity .25s, background .3s;
  }
  .track-glow{
    left:0;right:0;top:0;bottom:auto;
    width:100% !important;
    height:0;
    background:linear-gradient(180deg, transparent, #ff7a1a);
    transition:height .32s cubic-bezier(.2,.9,.3,1.2), opacity .25s, background .3s;
  }
  .track.dragging .track-fill,
  .track.dragging .track-glow{ transition:none; }

  /* 竖向流光 */
  .track-flow{
    background:repeating-linear-gradient(170deg,
      transparent 0 14px, rgba(255,255,255,.4) 14px 18px, transparent 18px 34px);
  }
  .track.charged .track-flow{
    animation:flowMoveVert 1.1s linear infinite;
  }
  @keyframes flowMoveVert{
    from{ background-position:0 0; }
    to{ background-position:0 68px; }
  }

  /* 竖向刻度线 */
  .track-lines{
    background:repeating-linear-gradient(180deg,
      rgba(255,255,255,.06) 0 1px, transparent 1px 14px);
    -webkit-mask:linear-gradient(180deg, transparent, #000);
    mask:linear-gradient(180deg, transparent, #000);
  }

  /* 圆钮：顶部起始，向下拖 */
  .knob{
    left:50%;
    top:0;
    width:48px;
    height:48px;
    font-size:17px;
    transform:translate(-50%, 3px);
    transition:transform .32s cubic-bezier(.2,.9,.3,1.2), box-shadow .25s, color .25s;
  }
  .knob.dragging{ transition:none; }

  /* 顶部按钮 */
  .top-actions{
    top:calc(8px + env(safe-area-inset-top,0px));
    right:10px;
  }
  .skip-btn{ padding:7px 12px;font-size:11px; }
  .mute-btn{ width:34px;height:34px; }

  /* 六星动画尺寸适配 */
  .s1-earth{
    width:170vh;
    height:170vh;
    bottom:-120vh;
  }
  .s3-platform{
    width:140px;height:140px;margin:-70px 0 0 -70px;
  }
  .s3-flyer{
    width:60px;height:60px;margin:-30px 0 0 -30px;font-size:30px;
  }
  .s3-flyer::before{ width:36px;height:150px; }
  .li-caption{ bottom:6%;font-size:11px; }
  .s1-meteor::after{ width:90px; }
}

@media (orientation: landscape){
  .pool-nav{
    left:10px;right:10px;top:auto;bottom:calc(7px + env(safe-area-inset-bottom,0px));
    width:auto;flex-direction:row;justify-content:center;transform:none;
  }
  .pool-nav.hidden{transform:translateY(12px)}
  .pool-nav-btn{width:auto;writing-mode:horizontal-tb}
}

<script>
/* ============================================================
   音频引擎（纯 Web Audio 合成）
   ============================================================ */
const AudioEngine = {
  ctx: null,
  master: null,
  bgmBus: null,
  sfxBus: null,
  muted: false,
  bgmPlaying: false,
  bgmNodes: [],
  bgmTimer: null,
  noiseBuffer: null,
  dragOsc: null,
  dragFilter: null,
  dragGain: null,
  legendMaster: null,

  ensure(){
    if (this.ctx){
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { this.ctx = new AC(); } catch(e){ return null; }

    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(this.ctx.destination);

    this.bgmBus = this.ctx.createGain();
    this.bgmBus.gain.value = 0.18;
    this.bgmBus.connect(this.master);

    this.sfxBus = this.ctx.createGain();
    this.sfxBus.gain.value = 0.75;
    this.sfxBus.connect(this.master);

    return this.ctx;
  },

  tone(freq, dur, opts){
    const ctx = this.ensure();
    if (!ctx) return;
    opts = opts || {};
    const type   = opts.type   || 'sine';
    const gain   = opts.gain   != null ? opts.gain : 0.2;
    const attack = opts.attack != null ? opts.attack : 0.01;
    const when   = opts.when   || 0;
    const bus    = opts.bus    || this.sfxBus;
    const freqEnd= opts.freqEnd|| null;
    const filter = opts.filter || null;

    const t = ctx.currentTime + when;
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);

    let node = osc;
    if (filter){
      const f = ctx.createBiquadFilter();
      f.type = filter.type || 'lowpass';
      f.frequency.value = filter.freq || 1200;
      f.Q.value = filter.Q != null ? filter.Q : 1;
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(bus);
    osc.start(t);
    osc.stop(t + attack + dur + 0.05);
    osc.onended = () => { try { osc.disconnect(); g.disconnect(); } catch(e){} };
  },

  noise(dur, opts){
    const ctx = this.ensure();
    if (!ctx) return;
    opts = opts || {};
    const gain   = opts.gain   != null ? opts.gain : 0.2;
    const when   = opts.when   || 0;
    const filter = opts.filter || null;

    if (!this.noiseBuffer){
      const len = Math.floor(ctx.sampleRate * 2);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
      this.noiseBuffer = buf;
    }

    const t = ctx.currentTime + when;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuffer;

    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    let node = src;
    if (filter){
      const f = ctx.createBiquadFilter();
      f.type = filter.type || 'lowpass';
      f.frequency.value = filter.freq || 1000;
      f.Q.value = filter.Q != null ? filter.Q : 1;
      src.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(this.sfxBus);
    src.start(t);
    src.stop(t + dur + 0.05);
    src.onended = () => { try { src.disconnect(); g.disconnect(); } catch(e){} };
  },

  startBGM(){
    if (this.bgmPlaying) return;
    const ctx = this.ensure();
    if (!ctx || this.muted) return;
    this.bgmPlaying = true;
    this.bgmNodes = [];

    const padFreqs = [36.71, 73.42, 110, 146.83];
    padFreqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = i < 2 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 9;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = i < 2 ? 220 : 600;
      filter.Q.value = 0.6;

      const g = ctx.createGain();
      g.gain.value = i === 0 ? 0.32 : 0.16;

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.03 + i * 0.013;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = i === 0 ? 0.1 : 0.06;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);

      osc.connect(filter);
      filter.connect(g);
      g.connect(this.bgmBus);
      osc.start();
      lfo.start();
      this.bgmNodes.push(osc, lfo);
    });

    const self = this;
    const tick = () => {
      if (!self.bgmPlaying) return;
      self._playBGMNote();
    };
    this.bgmTimer = setInterval(tick, 2400);
    setTimeout(tick, 700);
  },

  _playBGMNote(){
    const ctx = this.ensure();
    if (!ctx || this.muted) return;
    const scale = [293.66, 349.23, 440, 523.25, 587.33, 698.46];
    const f = scale[Math.floor(Math.random() * scale.length)];
    const t = ctx.currentTime;

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1300;
    filter.Q.value = 0.8;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);

    osc.connect(filter);
    filter.connect(g);
    g.connect(this.bgmBus);
    osc.start(t);
    osc.stop(t + 3.8);
    osc.onended = () => { try { osc.disconnect(); g.disconnect(); } catch(e){} };
  },

  stopBGM(){
    this.bgmPlaying = false;
    if (this.bgmTimer){ clearInterval(this.bgmTimer); this.bgmTimer = null; }
    this.bgmNodes.forEach(n => { try { n.stop(); } catch(e){} });
    this.bgmNodes = [];
  },

  duckBGM(ducked){
    if (!this.ctx || !this.bgmBus) return;
    const t = this.ctx.currentTime;
    const target = ducked ? 0.05 : 0.18;
    this.bgmBus.gain.setTargetAtTime(target, t, 0.35);
  },

  startDragSound(){
    const ctx = this.ensure();
    if (!ctx || this.dragOsc) return;

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 90;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    filter.Q.value = 5;

    const g = ctx.createGain();
    g.gain.value = 0;

    osc.connect(filter);
    filter.connect(g);
    g.connect(this.sfxBus);
    osc.start();

    this.dragOsc = osc;
    this.dragFilter = filter;
    this.dragGain = g;
  },

  updateDragSound(p){
    if (!this.dragOsc || !this.ctx) return;
    const t = this.ctx.currentTime;
    this.dragOsc.frequency.setTargetAtTime(90 + p * 220, t, 0.05);
    this.dragFilter.frequency.setTargetAtTime(420 + p * 1900, t, 0.05);
    this.dragGain.gain.setTargetAtTime(0.015 + p * 0.08, t, 0.05);
  },

  stopDragSound(){
    if (!this.dragOsc) return;
    const osc = this.dragOsc;
    const g = this.dragGain;
    if (this.ctx){
      const t = this.ctx.currentTime;
      g.gain.setTargetAtTime(0, t, 0.05);
    }
    setTimeout(() => { try { osc.stop(); } catch(e){} }, 220);
    this.dragOsc = null;
    this.dragFilter = null;
    this.dragGain = null;
  },

  playCharge(){
    this.tone(200, 1.1, {
      type:'sawtooth', gain:0.13, freqEnd:1700,
      filter:{ type:'lowpass', freq:2600, Q:2 }
    });
    [1200, 1600, 2000, 2400].forEach((f, i) => {
      this.tone(f, 0.42, { type:'sine', gain:0.05, when: i * 0.07 });
    });
  },

  playBurst(){
    this.tone(80, 0.95, { type:'sine', gain:0.36, freqEnd: 38 });
    this.noise(0.62, { gain:0.26, filter:{ type:'bandpass', freq:800, Q:0.8 } });
    [1800, 2400, 3000].forEach((f, i) => {
      this.tone(f, 0.5, { type:'triangle', gain:0.045, when: 0.04 + i * 0.05 });
    });
  },

  playReveal(stars){
    if (stars >= 6){
      const chord = [261.63, 329.63, 392, 523.25, 659.25];
      chord.forEach((f, i) => {
        this.tone(f, 1.8, {
          type:'triangle', gain:0.13, when: i * 0.06,
          filter:{ type:'lowpass', freq:3000 }
        });
      });
      this.tone(65.41, 1.8, { type:'sine', gain:0.18, filter:{ type:'lowpass', freq:400 } });
      for (let i=0;i<8;i++){
        this.tone(1500 + Math.random() * 2000, 0.4, {
          type:'sine', gain:0.028, when: 0.2 + i * 0.08
        });
      }
    } else if (stars >= 5){
      [392, 493.88, 587.33].forEach((f, i) => {
        this.tone(f, 1.2, { type:'triangle', gain:0.11, when: i * 0.045 });
      });
    } else {
      this.tone(523.25, 0.5, { type:'sine', gain:0.09 });
      this.tone(659.25, 0.5, { type:'sine', gain:0.07, when: 0.045 });
    }
  },

  playLegendMusic(){
    const ctx = this.ensure();
    if (!ctx) return;
    this.stopLegendMusic(false);

    const t0 = ctx.currentTime + 0.03;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.linearRampToValueAtTime(0.5, t0 + 0.6);
    master.gain.setValueAtTime(0.5, t0 + 8.9);
    master.gain.linearRampToValueAtTime(0.0001, t0 + 9.6);
    master.connect(this.master);
    this.legendMaster = master;

    this.duckBGM(true);

    [55, 82.41, 110].forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.1 - i * 0.022;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 280;
      osc.connect(filter);
      filter.connect(g);
      g.connect(master);
      osc.start(t0);
      osc.stop(t0 + 9.7);
    });

    const chords = [
      [220, 261.63, 329.63],
      [233.08, 293.66, 349.23],
      [261.63, 329.63, 392],
      [293.66, 369.99, 440]
    ];
    chords.forEach((chord, ci) => {
      const t = t0 + ci * 2.4;
      chord.forEach(f => {
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.075, t + 0.7);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, t);
        filter.frequency.linearRampToValueAtTime(2600, t + 1.6);
        osc.connect(filter);
        filter.connect(g);
        g.connect(master);
        osc.start(t);
        osc.stop(t + 2.6);
      });
    });

    for (let i = 0; i < 16; i++){
      const t = t0 + 0.8 + i * 0.5;
      if (i % 2 === 0){
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.16);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        osc.connect(g);
        g.connect(master);
        osc.start(t);
        osc.stop(t + 0.28);
      }
    }

    for (let i = 0; i < 22; i++){
      const t = t0 + 1.2 + Math.random() * 6.8;
      const f = 1600 + Math.random() * 2800;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.022, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      osc.connect(g);
      g.connect(master);
      osc.start(t);
      osc.stop(t + 0.5);
    }

    {
      const t = t0 + 7.0;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, t);
      osc.frequency.exponentialRampToValueAtTime(2200, t + 2.2);
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(260, t);
      filter.frequency.exponentialRampToValueAtTime(3800, t + 2.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09, t + 1.9);
      g.gain.linearRampToValueAtTime(0.0001, t + 2.35);
      osc.connect(filter);
      filter.connect(g);
      g.connect(master);
      osc.start(t);
      osc.stop(t + 2.4);
    }
  },

  stopLegendMusic(fade){
    if (!this.legendMaster) return;
    const ctx = this.ctx;
    const m = this.legendMaster;
    try {
      m.gain.cancelScheduledValues(ctx.currentTime);
      if (fade === false){
        m.gain.setValueAtTime(0, ctx.currentTime);
      } else {
        m.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
      }
    } catch(e){}
    setTimeout(() => { try { m.disconnect(); } catch(e){} }, fade === false ? 50 : 500);
    this.legendMaster = null;
    this.duckBGM(false);
  },

  playImpact(){
    this.tone(60, 1.5, { type:'sine', gain:0.5, freqEnd: 30 });
    this.noise(0.85, { gain:0.42, filter:{ type:'lowpass', freq:600 } });
    this.tone(240, 0.6, { type:'sawtooth', gain:0.14, freqEnd: 80, filter:{ type:'lowpass', freq:800 } });
  },

  playClick(){
    this.tone(660, 0.08, { type:'square', gain:0.035 });
    this.tone(990, 0.06, { type:'sine', gain:0.025, when: 0.02 });
  },

  playSummary(){
    [392, 493.88, 587.33, 783.99, 987.77].forEach((f, i) => {
      this.tone(f, 0.9, { type:'triangle', gain:0.095, when: i * 0.075 });
    });
  },

  stopAll(){
    this.stopDragSound();
    this.stopLegendMusic(false);
  },

  toggleMute(){
    this.muted = !this.muted;
    this.ensure();
    if (this.master){
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.9, this.ctx.currentTime, 0.05);
    }
    if (!this.muted && !this.bgmPlaying) this.startBGM();
    if (this.muted) this.stopBGM();
    updateMuteBtn();
  }
};

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
function rgba(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function setRarityVars(el, color){
  el.style.setProperty('--c', color);
  el.style.setProperty('--c-glow', rgba(color,.55));
  el.style.setProperty('--c-soft', rgba(color,.16));
  el.style.setProperty('--c-border', rgba(color,.5));
}
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function vibrate(pattern){
  if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function'){
    try { navigator.vibrate(pattern); } catch(e){}
  }
}

const isFinePointer = (function(){
  try {
    return window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  } catch(e){
    return false;
  }
})();

/* ================= 抽卡逻辑（严格概率，无保底） ================= */
function rollRarity(){
  const r = Math.random();
  if (r < 0.024) return 6;
  if (r < 0.124) return 5;
  return 4;
}

function rollN(n){
  const out = [];
  for (let i=0;i<n;i++){
    const stars = rollRarity();
    const base = pick(POOLS[selectedPool].cards[stars]);
    out.push({...base, stars, color:RARITY[stars].color});
  }
  return out;
}

/* ================= 拉杆（横向 / 竖向自适应） ================= */
function measure(){
  if (isVert){
    maxPos = Math.max(0, track.clientHeight - knob.offsetHeight - 6);
  } else {
    maxPos = Math.max(0, track.clientWidth - knob.offsetWidth - 6);
  }
}

function render(){
  const knobSize = isVert ? knob.offsetHeight : knob.offsetWidth;
  const p = maxPos > 0 ? Math.min(1, Math.max(0, pos / maxPos)) : 0;
  const fillPx = 3 + pos + knobSize / 2;

  if (isVert){
    knob.style.transform = `translate(-50%, ${3 + pos}px)`;
    trackFill.style.height = fillPx + 'px';
    trackGlow.style.height = fillPx + 'px';
  } else {
    knob.style.transform = `translate(${3 + pos}px, -50%)`;
    trackFill.style.width = fillPx + 'px';
    trackGlow.style.width = fillPx + 'px';
  }

  if (chargedColor) return;

  trackFill.style.opacity = (0.22 + p * 0.78).toFixed(2);
  trackGlow.style.opacity = (p * 0.95).toFixed(2);
  ambient.style.opacity = (1 - p * 0.85).toFixed(2);

  knob.style.boxShadow =
    `0 0 ${14 + p * 26}px rgba(255,122,26,${(0.25 + p * 0.55).toFixed(2)}), ` +
    `inset 0 0 14px rgba(255,140,60,${(0.2 + p * 0.3).toFixed(2)})`;
  knob.style.color = p > 0.8 ? '#ffe0c0' : '';
  track.style.borderColor = p > 0.78 ? 'rgba(255,170,90,.9)' : '';

  if (p > 0.78){
    leverHint.textContent = '松手召唤';
    leverHint.style.color = 'rgba(255,170,90,.95)';
  } else if (p > 0.3){
    leverHint.textContent = '继续拖动…';
    leverHint.style.color = '';
  } else {
    updateLeverHintIdle();
  }
}

function applyChargedVisual(){
  if (!chargedColor) return;
  const gc = chargedColor;

  pos = maxPos;
  const knobSize = isVert ? knob.offsetHeight : knob.offsetWidth;
  const fillPx = 3 + pos + knobSize / 2;

  if (isVert){
    knob.style.transform = `translate(-50%, ${3 + pos}px)`;
    trackFill.style.height = fillPx + 'px';
    trackGlow.style.height = fillPx + 'px';
    trackFill.style.background = `linear-gradient(180deg, ${rgba(gc,.12)}, ${gc})`;
    trackGlow.style.background = `linear-gradient(180deg, transparent, ${gc})`;
  } else {
    knob.style.transform = `translate(${3 + pos}px, -50%)`;
    trackFill.style.width = fillPx + 'px';
    trackGlow.style.width = fillPx + 'px';
    trackFill.style.background = `linear-gradient(90deg, ${rgba(gc,.12)}, ${gc})`;
    trackGlow.style.background = `linear-gradient(90deg, transparent, ${gc})`;
  }

  track.style.setProperty('--gc', gc);
  track.style.borderColor = gc;
  trackFill.style.opacity = '1';
  trackGlow.style.opacity = '1';
  ambient.style.opacity = '0';
  track.classList.add('charged');

  knob.style.boxShadow =
    `0 0 46px ${gc}, 0 0 100px ${rgba(gc,.45)}, inset 0 0 16px ${rgba(gc,.5)}`;
  knob.style.color = gc;
}

track.addEventListener('pointerdown', e => {
  if (locked) return;
  measure();

  const r = track.getBoundingClientRect();
  let onKnob = false;

  if (isVert){
    const py = e.clientY - r.top;
    const knobTop = 3 + pos;
    onKnob = py >= knobTop - 8 && py <= knobTop + knob.offsetHeight + 8;
    if (!onKnob){
      if (!isFinePointer) return;
      grabOffset = knob.offsetHeight / 2;
      pos = Math.max(0, Math.min(maxPos, py - grabOffset - 3));
    } else {
      grabOffset = py - knobTop;
    }
  } else {
    const px = e.clientX - r.left;
    const knobLeft = 3 + pos;
    onKnob = px >= knobLeft - 8 && px <= knobLeft + knob.offsetWidth + 8;
    if (!onKnob){
      if (!isFinePointer) return;
      grabOffset = knob.offsetWidth / 2;
      pos = Math.max(0, Math.min(maxPos, px - grabOffset - 3));
    } else {
      grabOffset = px - knobLeft;
    }
  }

  dragging = true;
  knob.classList.add('dragging');
  track.classList.add('dragging');
  try { track.setPointerCapture(e.pointerId); } catch(err){}
  render();

  AudioEngine.startDragSound();
  AudioEngine.updateDragSound(maxPos > 0 ? pos / maxPos : 0);

  if (e.cancelable) e.preventDefault();
});

track.addEventListener('pointermove', e => {
  if (!dragging) return;
  const r = track.getBoundingClientRect();

  if (isVert){
    const py = e.clientY - r.top;
    pos = Math.max(0, Math.min(maxPos, py - grabOffset - 3));
  } else {
    const px = e.clientX - r.left;
    pos = Math.max(0, Math.min(maxPos, px - grabOffset - 3));
  }
  render();
  AudioEngine.updateDragSound(maxPos > 0 ? pos / maxPos : 0);
});

function endDrag(){
  if (!dragging) return;
  dragging = false;
  knob.classList.remove('dragging');
  track.classList.remove('dragging');
  AudioEngine.stopDragSound();
  const p = maxPos > 0 ? pos / maxPos : 0;
  if (p > 0.78) startPull();
  else { pos = 0; render(); }
}

track.addEventListener('pointerup', endDrag);
track.addEventListener('pointercancel', endDrag);
track.addEventListener('lostpointercapture', () => {
  if (dragging) endDrag();
});

/* ================= 开始抽卡 ================= */
function startPull(){
  locked = true;
  pullModeRow.classList.add('disabled');
  results = rollN(pullCount);

  const best = results.reduce((a,b) => (b.stars > a.stars ? b : a), results[0]);
  const gc = best.color;
  chargedColor = gc;
  const token = ++pullToken;

  vibrate([35, 45, 90]);

  AudioEngine.playCharge();
  AudioEngine.playBurst();

  const knobRect = knob.getBoundingClientRect();
  const appRect = app.getBoundingClientRect();
  sparkBurst(
    gc,
    knobRect.left - appRect.left + knobRect.width / 2,
    knobRect.top - appRect.top + knobRect.height / 2,
    22
  );

  burstEffect(gc);
  applyChargedVisual();

  leverHint.textContent = '星轨共鸣……';
  leverHint.style.color = gc;

  setTimeout(() => {
    if (token !== pullToken) return;
    leverBar.classList.add('hidden');
    startReveal();
  }, 880);
}

function buildDots(){

function revealCard(i){
  const card = results[i];
  const token = ++revealToken;
  readyForNext = false;
  tapHint.classList.remove('show');
  stage.innerHTML = '';
  rcNow.textContent = i + 1;

  [...dotsWrap.children].forEach((d,k) => {
    d.className = 'dot';
    d.style.background = '';
    d.style.boxShadow = '';
    if (k < i){
      d.classList.add('done');
      d.style.background = results[k].color;
      d.style.boxShadow = `0 0 8px ${results[k].color}`;
    } else if (k === i){
      d.classList.add('current');
    }
  });

  if (card.stars >= 6){
    playLegendIntro(card, token);
    return;
  }

  AudioEngine.playReveal(card.stars);

  const flash = document.createElement('div');
  flash.className = 'flash-card';
  if (card.stars >= 5) flash.classList.add('flash-strong');
  setRarityVars(flash, card.color);
  flash.innerHTML = `
    <div class="flash-rays-wrap"><div class="flash-rays"></div></div>
    <div class="flash-ring"></div>
    <div class="flash-stars">${'★'.repeat(card.stars)}</div>
    <div class="flash-label">${RARITY[card.stars].name} · 降临</div>
  `;
  stage.appendChild(flash);

  if (card.stars >= 5){
    shakeSoft();
    vibrate([20, 30, 50]);
  }

  setTimeout(() => {
    if (token !== revealToken) return;
    const el = buildCardEl(card);
    stage.appendChild(el);
    flash.classList.add('out');

    setTimeout(() => {
      if (token !== revealToken) return;
      flash.remove();
    }, 450);

    setTimeout(() => {
      if (token !== revealToken) return;
      readyForNext = true;
      tapHint.classList.add('show');
    }, 330);
  }, 620);
}

function buildCardEl(card){
  const el = document.createElement('div');
  el.className = 'gcard';
  setRarityVars(el, card.color);

  const sparkCount = card.stars >= 6 ? 11 : card.stars >= 5 ? 8 : 5;
  let sparks = '';
  for (let i=0;i<sparkCount;i++){
    const left = (8 + Math.random() * 84).toFixed(1);
    const bottom = (8 + Math.random() * 42).toFixed(1);
    const size = (3 + Math.random() * 4).toFixed(1);
    const delay = (Math.random() * 2.6).toFixed(2);
    const dur = (2.3 + Math.random() * 1.8).toFixed(2);
    sparks += `<span class="card-spark" style="left:${left}%;bottom:${bottom}%;width:${size}px;height:${size}px;animation-delay:${delay}s;animation-duration:${dur}s"></span>`;
  }

  el.innerHTML = `
    <div class="gcard-art">
      <div class="rays-wrap"><div class="rays"></div></div>
      <div class="gcard-sigil">${card.sigil}</div>
      ${sparks}
    </div>
    <div class="gcard-info">
      <div class="gcard-name">${card.name}</div>
      <div class="gcard-meta">
        <span class="gcard-tag">${card.tag}</span>
        <span class="gcard-stars">${'★'.repeat(card.stars)}</span>
      </div>
    </div>
  `;
  return el;
}

/* 点击继续 */
screenReveal.addEventListener('click', () => {
  if (!readyForNext) return;
  readyForNext = false;
  tapHint.classList.remove('show');
  AudioEngine.playClick();

  const cur = stage.querySelector('.gcard');
  if (cur) cur.classList.add('leaving');

  setTimeout(() => {
    idx++;
    if (idx >= results.length){
      setTimeout(showSummary, 120);
    } else {
      revealCard(idx);
    }
  }, 220);
});

/* ================= 总览 ================= */
function showSummary(){
  setScreen('summary');
  sumHead.textContent = results.length === 1 ? '一抽结果' : '十连结果';
  sumGrid.innerHTML = '';
  results.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'sum-card';
    setRarityVars(el, card.color);
    el.style.animationDelay = (i * 45) + 'ms, ' + (i * 45 + 500) + 'ms';
    el.innerHTML = `
      <div class="sum-sigil">${card.sigil}</div>
      <div class="sum-body">
        <div class="sum-name">${card.name}</div>
        <div class="sum-meta">
          <span class="sum-tag">${card.tag}</span>
          <span class="sum-stars">${'★'.repeat(card.stars)}</span>
        </div>
      </div>
    `;
    sumGrid.appendChild(el);
  });
  AudioEngine.playSummary();
}

/* ================= 右上角按钮 ================= */
skipBtn.addEventListener('click', skipToSummary);
muteBtn.addEventListener('click', () => AudioEngine.toggleMute());

function skipToSummary(){
  pullToken++;
  revealToken++;
  readyForNext = false;
  tapHint.classList.remove('show');
  stage.innerHTML = '';
  fxLayer.innerHTML = '';
  hideLegendIntro();
  AudioEngine.stopAll();

  if (results.length === 0){
    results = rollN(pullCount);
  }

  locked = true;
  pos = maxPos;
  leverBar.classList.add('hidden');

  showSummary();
}

/* ================= 重置 ================= */
$('againBtn').addEventListener('click', reset);

function reset(){
  locked = false;
  chargedColor = null;
  pullToken++;
  revealToken++;
  pos = 0;
  results = [];
  idx = 0;
  readyForNext = false;

  hideLegendIntro();
  AudioEngine.stopAll();

  pullModeRow.classList.remove('disabled');

  track.classList.remove('charged', 'dragging');
  track.style.removeProperty('--gc');
  track.style.borderColor = '';

  // 同时清掉横向/纵向的 inline 尺寸与渐变
  trackFill.style.background = '';
  trackFill.style.opacity = '';
  trackFill.style.width = '';
  trackFill.style.height = '';
  trackGlow.style.background = '';
  trackGlow.style.opacity = '';
  trackGlow.style.width = '';
  trackGlow.style.height = '';
  ambient.style.opacity = '';
  knob.style.boxShadow = '';
  knob.style.color = '';
  knob.classList.remove('dragging');

  measure();
  updateLeverHintIdle();
  render();

  leverBar.classList.remove('hidden');
  stage.innerHTML = '';
  fxLayer.innerHTML = '';
  tapHint.classList.remove('show');
  setScreen('idle');
}

/* ================= 初始化 ================= */
document.addEventListener('pointerdown', () => {
  AudioEngine.ensure();
  if (!AudioEngine.muted && !AudioEngine.bgmPlaying) AudioEngine.startBGM();
}, true);

document.addEventListener('visibilitychange', () => {
  if (!AudioEngine.ctx) return;
  if (document.hidden){
    AudioEngine.ctx.suspend();
  } else {
    AudioEngine.ctx.resume();
  }
});

function handleResize(){
  const wasVert = isVert;
  checkLayout();

  if (wasVert !== isVert){
    // 方向切换：清掉另一方向的 inline 尺寸，进度归零
    trackFill.style.width = '';
    trackFill.style.height = '';
    trackGlow.style.width = '';
    trackGlow.style.height = '';
    pos = 0;
    updateLeverHintIdle();
  }

  measure();
  if (chargedColor) applyChargedVisual();
  else render();
}

window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => {
  setTimeout(handleResize, 120);
});

window.addEventListener('load', () => {
  renderFeaturedRoster();
  checkLayout();
  measure();
  updateLeverHintIdle();
  render();
  setScreen('idle');
});

spawnEmbers();
renderFeaturedRoster();
checkLayout();
measure();
updateLeverHintIdle();
render();
setScreen('idle');
updateMuteBtn();
</script>
</body>
